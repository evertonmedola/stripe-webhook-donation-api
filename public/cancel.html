<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doação cancelada</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="status-page">
  <main class="panel">
    <div class="counter is-failed" role="status" aria-label="Doação cancelada">
      <span class="counter-currency">R$</span>
      <div class="counter-digits">
        <span class="digit">0</span><span class="digit">0</span><span class="digit-sep">,</span><span class="digit">0</span><span class="digit">0</span>
      </div>
      <span class="rivet-bl" aria-hidden="true"></span>
      <span class="rivet-br" aria-hidden="true"></span>
    </div>

    <h1>Doação cancelada</h1>
    <p id="status-message">Nenhum valor foi cobrado. Você pode tentar novamente quando quiser.</p>
    <a class="back-link" href="/index.html">Voltar para a página de doação</a>

    <footer class="credit">
      <a href="https://github.com/evertonmedola" target="_blank" rel="noopener">Desenvolvido por Everton Medola</a>
    </footer>
  </main>
</body>
</html>
